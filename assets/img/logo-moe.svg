<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" role="img" aria-label="شعار وزارة التعليم - المملكة العربية السعودية">
  <title>وزارة التعليم — المملكة العربية السعودية</title>

  <defs>
    <linearGradient id="moeGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C36A"/>
      <stop offset="55%" stop-color="#C79A3C"/>
      <stop offset="100%" stop-color="#9C7326"/>
    </linearGradient>
    <linearGradient id="moeGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E9E6B"/>
      <stop offset="100%" stop-color="#16694A"/>
    </linearGradient>
  </defs>

  <!-- ================= الشعار (نخلة + كتاب + سيفين) ================= -->
  <g transform="translate(22,25)">

    <!-- سيفان متقاطعان خلف النخلة -->
    <g opacity="0.92">
      <path d="M30 18 L92 92" stroke="url(#moeGold)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M92 18 L30 92" stroke="url(#moeGold)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M22 14 L28 22 M100 14 L94 22" stroke="url(#moeGold)" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- سعف النخلة -->
    <g stroke="url(#moeGreen)" stroke-width="5.5" stroke-linecap="round" fill="none">
      <path d="M61 14 C61 34 61 44 61 52"/>
      <path d="M61 20 C48 26 40 34 36 44"/>
      <path d="M61 20 C74 26 82 34 86 44"/>
      <path d="M61 30 C50 34 42 42 39 52"/>
      <path d="M61 30 C72 34 80 42 83 52"/>
      <path d="M61 40 C52 44 46 50 44 58"/>
      <path d="M61 40 C70 44 76 50 78 58"/>
      <path d="M61 10 C58 6 58 4 61 2 C64 4 64 6 61 10 Z" fill="url(#moeGreen)" stroke="none"/>
    </g>
    <!-- جذع النخلة -->
    <path d="M56 54 L66 54 L64 78 L58 78 Z" fill="#8A6B33"/>

    <!-- الكتاب المفتوح أسفل الشعار -->
    <g transform="translate(8,80)">
      <path d="M0 4 C16 -2 32 0 45 6 L45 32 C32 26 16 24 0 30 Z" fill="#0B3B6F"/>
      <path d="M90 4 C74 -2 58 0 45 6 L45 32 C58 26 74 24 90 30 Z" fill="#164E8C"/>
      <path d="M45 6 L45 32" stroke="#0B3B6F" stroke-width="2.5"/>
    </g>
  </g>

  <!-- ================= النص ================= -->
  <g font-family="'Segoe UI','Tahoma',Arial,sans-serif" fill="#0B3B6F">
    <text x="176" y="60" font-size="30" font-weight="700" text-anchor="middle">وزارة التعليم</text>
    <text x="176" y="86" font-size="13.5" font-weight="600" text-anchor="middle" fill="#2B5C8F" direction="ltr">Ministry of Education</text>
    <rect x="126" y="96" width="100" height="2.5" rx="1.25" fill="url(#moeGold)"/>
    <text x="176" y="122" font-size="13" font-weight="600" text-anchor="middle" fill="#3A6EA5">المملكة العربية السعودية</text>
  </g>
</svg>